<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salão do Dê - Alemoa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .barber-pole {
            background: repeating-linear-gradient(45deg, #0f172a, #0f172a 20px, #dc2626 20px, #dc2626 40px, #ffffff 40px, #ffffff 60px);
            height: 12px;
            width: 100%;
        }
        .blinking { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.4; } }
        body { background-color: #0f172a; color: #f8fafc; }
        .modal { background: rgba(0,0,0,0.8); }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">
    <div class="barber-pole shadow-lg"></div>
    
    <header class="bg-gray-900 border-b border-gray-800 p-4 text-center sticky top-0 z-10 shadow-md">
        <h1 class="text-2xl font-bold text-white tracking-wider">SALÃO DO DÊ <span class="text-red-500">ALEMOA</span></h1>
        <div id="userInfo" class="text-sm text-gray-400 mt-1 hidden"></div>
    </header>

    <main id="appContent" class="flex-grow p-4 max-w-lg mx-auto w-full"></main>

    <div class="barber-pole shadow-lg mt-auto"></div>

    <!-- AUDIO BEEPS -->
    <audio id="beepAdmin" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
    <audio id="beepClient" src="https://actions.google.com/sounds/v1/alarms/double_beep.ogg" preload="auto"></audio>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, query, where, getDocs, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyRPstlq91unKjiWmHEktAUXgCtfVWTFU",
            authDomain: "desafio-7-dias-d3680.firebaseapp.com",
            projectId: "desafio-7-dias-d3680",
            storageBucket: "desafio-7-dias-d3680.firebasestorage.app",
            messagingSenderId: "981540824605",
            appId: "1:981540824605:web:f35d6a0616a3bce54308f4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State
        let currentUser = JSON.parse(localStorage.getItem('salao_user')) || null;
        let isAdmin = localStorage.getItem('salao_admin') === 'true';
        let selectedDate = new Date().toISOString().split('T')[0];
        let dayAppointments = [];
        let caixaAtual = null;
        let globalInterval = null;

        const timeSlots = [
            "08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", 
            "12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", 
            "16:30", "17:00", "17:30", "18:00", "18:30"
        ];
        
        const servicosTabela = {
            pezinho: { nome: 'Pézinho', preco: 10, duracao: 10 },
            corte: { nome: 'Corte', preco: 30, duracao: 30 },
            barba: { nome: 'Barba', preco: 25, duracao: 20 }
        };

        // Init App
        function init() {
            if (isAdmin) {
                renderAdmin();
                listenToCaixa();
            } else if (currentUser) {
                renderClient();
            } else {
                renderLogin();
            }
            if (currentUser || isAdmin) listenToAppointments();
            
            if(globalInterval) clearInterval(globalInterval);
            globalInterval = setInterval(updateTimers, 1000);
        }

        function playBeep(type) {
            try {
                if(type === 'admin') document.getElementById('beepAdmin').play();
                if(type === 'client') document.getElementById('beepClient').play();
            } catch(e) {}
        }

        // --- LISTENERS FIREBASE ---
        let unsubAgendamentos = null;
        let unsubCaixa = null;

        function listenToAppointments() {
            if (unsubAgendamentos) unsubAgendamentos();
            const q = query(collection(db, "salao_agendamentos"), where("data", "==", selectedDate));
            
            unsubAgendamentos = onSnapshot(q, (snapshot) => {
                const oldLen = dayAppointments.length;
                dayAppointments = [];
                snapshot.forEach(doc => {
                    dayAppointments.push({ id: doc.id, ...doc.data() });
                });
                
                if(isAdmin && dayAppointments.length > oldLen && oldLen > 0) playBeep('admin');
                
                checkClientNotifications();
                if (isAdmin) renderAdminAgenda();
                else renderClientAgenda();
            }, (error) => {
                alert("Erro de permissão no Firebase. Libere o banco de dados para leitura/escrita pública (allow read, write: if true;).");
            });
        }

        function listenToCaixa() {
            if (unsubCaixa) unsubCaixa();
            const docRef = doc(db, "salao_caixa", selectedDate);
            unsubCaixa = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    caixaAtual = docSnap.data();
                } else {
                    caixaAtual = null;
                }
                if (isAdmin) renderAdminAgenda();
            });
        }

        function checkClientNotifications() {
            if(isAdmin || !currentUser) return;
            
            const meuCorte = dayAppointments.find(a => a.telefone === currentUser.telefone && a.status === 'chamado');
            if(meuCorte) {
                const elapsed = (Date.now() - meuCorte.chamadoEm) / 1000;
                if(elapsed < 120 && elapsed > 0 && Math.floor(elapsed) % 30 === 0) playBeep('client');
            }

            const emAndamento = dayAppointments.find(a => a.status === 'em_andamento');
            if(emAndamento) {
                const myNext = dayAppointments.find(a => a.telefone === currentUser.telefone && a.status === 'agendado');
                if(myNext) {
                    const elapsed = (Date.now() - emAndamento.iniciadoEm) / 1000 / 60;
                    const isPezinhoOnly = emAndamento.servicos.length === 1 && emAndamento.servicos.includes('pezinho');
                    if(isPezinhoOnly && elapsed > 5 && elapsed < 6) playBeep('client');
                    if(!isPezinhoOnly && elapsed > 15 && elapsed < 16) playBeep('client');
                }
            }
        }

        // --- AUTH & LOGIN ---
        function renderLogin() {
            const app = document.getElementById('appContent');
            app.innerHTML = `
                <div class="bg-gray-800 p-6 rounded-lg shadow-xl text-center max-w-sm mx-auto mt-10 border border-gray-700">
                    <h2 class="text-xl font-bold mb-6">Acesso à Agenda</h2>
                    
                    <div id="loginClientForm" class="space-y-4">
                        <input type="text" id="clientName" placeholder="Seu Nome" class="w-full p-3 rounded bg-gray-900 border border-gray-600 text-white focus:outline-none focus:border-red-500">
                        <input type="tel" id="clientPhone" placeholder="WhatsApp (Apenas Números)" class="w-full p-3 rounded bg-gray-900 border border-gray-600 text-white focus:outline-none focus:border-red-500">
                        <button onclick="window.loginClient()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded shadow-lg transition">VER AGENDA</button>
                        <p class="text-xs text-gray-400 mt-4 cursor-pointer hover:text-white" onclick="window.toggleAdminLogin()">Acesso Restrito (Barbeiro)</p>
                    </div>

                    <div id="loginAdminForm" class="space-y-4 hidden mt-4">
                        <input type="email" id="adminEmail" placeholder="E-mail" class="w-full p-3 rounded bg-gray-900 border border-gray-600 text-white focus:outline-none focus:border-blue-500">
                        <input type="password" id="adminPass" placeholder="Senha" class="w-full p-3 rounded bg-gray-900 border border-gray-600 text-white focus:outline-none focus:border-blue-500">
                        <button onclick="window.loginAdmin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded shadow-lg transition">ENTRAR NO SISTEMA</button>
                        <p class="text-xs text-gray-400 mt-4 cursor-pointer hover:text-white" onclick="window.toggleAdminLogin()">Voltar para Cliente</p>
                    </div>
                </div>
            `;
        }

        window.toggleAdminLogin = () => {
            document.getElementById('loginClientForm').classList.toggle('hidden');
            document.getElementById('loginAdminForm').classList.toggle('hidden');
        };

        window.loginClient = async () => {
            const nome = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.replace(/\D/g, '');
            
            if(nome.length < 2 || phone.length < 10) return alert("Preencha o nome e um WhatsApp válido.");
            
            const user = { nome, telefone: phone };
            await setDoc(doc(db, "salao_clientes", phone), user);
            localStorage.setItem('salao_user', JSON.stringify(user));
            currentUser = user;
            init();
        };

        window.loginAdmin = () => {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            if(email === 'admin@admin.com' && pass === 'admin123') {
                localStorage.setItem('salao_admin', 'true');
                isAdmin = true;
                init();
            } else {
                alert("Credenciais incorretas.");
            }
        };

        window.logout = () => {
            localStorage.removeItem('salao_user');
            localStorage.removeItem('salao_admin');
            currentUser = null;
            isAdmin = false;
            init();
        };

        // --- CLIENT UI ---
        function renderClient() {
            document.getElementById('userInfo').innerHTML = `Olá, <b class="text-white">${currentUser.nome}</b> <button onclick="window.logout()" class="ml-2 text-red-500 underline">Sair</button>`;
            document.getElementById('userInfo').classList.remove('hidden');

            const app = document.getElementById('appContent');
            app.innerHTML = `
                <div class="mb-4 flex justify-between items-center bg-gray-800 p-3 rounded-lg border border-gray-700">
                    <label class="font-bold text-gray-300">Data:</label>
                    <input type="date" id="datePicker" value="${selectedDate}" class="bg-gray-900 border border-gray-600 text-white p-2 rounded focus:outline-none" onchange="window.changeDate(this.value)">
                </div>
                
                <div id="clientGrid" class="space-y-3 pb-8"></div>
            `;
            renderClientAgenda();
        }

        function renderClientAgenda() {
            const grid = document.getElementById('clientGrid');
            if(!grid) return;
            
            const dateObj = new Date(selectedDate + "T12:00:00");
            if(dateObj.getDay() === 0 || dateObj.getDay() === 1) {
                grid.innerHTML = `<div class="text-center text-gray-400 py-10 bg-gray-800 rounded-lg">Fechado aos Domingos e Segundas.</div>`;
                return;
            }

            // Regra: Limite de 1 agendamento ativo por dia
            const myActiveApt = dayAppointments.find(a => a.telefone === currentUser.telefone && a.status !== 'desmarcado' && a.status !== 'finalizado');
            const hasBookedToday = !!myActiveApt;

            let html = '';
            timeSlots.forEach(hora => {
                const apt = dayAppointments.find(a => a.hora === hora);
                
                if (!apt) {
                    if (hasBookedToday) {
                        html += `
                            <div class="flex items-center justify-between bg-gray-800 p-4 rounded-lg border border-gray-700 opacity-50">
                                <span class="font-bold text-lg">${hora}</span>
                                <span class="text-sm font-semibold text-gray-500 uppercase">Bloqueado (Limite 1/dia)</span>
                            </div>`;
                    } else {
                        html += `
                            <div class="flex items-center justify-between bg-gray-800 border-l-4 border-green-500 p-4 rounded-lg shadow-sm">
                                <span class="font-bold text-lg">${hora}</span>
                                <button onclick="window.openClientModal('${hora}')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-bold shadow transition">AGENDAR</button>
                            </div>`;
                    }
                } 
                else if (apt.status === 'desmarcado') {
                    html += `
                        <div class="flex items-center justify-between bg-gray-900 border-l-4 border-gray-600 p-4 rounded-lg opacity-70">
                            <span class="font-bold text-lg text-gray-500">${hora}</span>
                            <span class="text-sm font-bold text-gray-500 uppercase">Indisponível</span>
                        </div>`;
                }
                else if (apt.status === 'finalizado') {
                    html += `
                        <div class="flex items-center justify-between bg-gray-900 border-l-4 border-red-900 p-4 rounded-lg opacity-60">
                            <span class="font-bold text-lg text-gray-400">${hora}</span>
                            <span class="text-sm text-red-500 uppercase font-bold">Finalizado</span>
                        </div>`;
                }
                else if (apt.telefone === currentUser.telefone) {
                    // É o agendamento do proprio usuario
                    let statusHtml = '';
                    if(apt.status === 'chamado') {
                        statusHtml = `<div class="bg-red-600 text-white p-3 rounded-lg text-center font-bold blinking w-full mt-2 border border-red-400">SUA VEZ! <br><span class="text-2xl" id="timer_${apt.id}"></span></div>`;
                    } else if (apt.status === 'em_andamento') {
                        statusHtml = `<div class="bg-orange-600 text-white p-2 rounded text-center font-bold blinking mt-2 border border-orange-400">NA CADEIRA - <span id="timer_${apt.id}"></span></div>`;
                    } else {
                        statusHtml = `<button onclick="window.cancelClient('${apt.id}')" class="text-sm text-red-400 mt-2 hover:text-red-300 underline">Desmarcar</button>`;
                    }

                    html += `
                        <div class="flex flex-col bg-gray-800 border-l-4 border-yellow-500 p-4 rounded-lg shadow-md">
                            <div class="flex items-center justify-between w-full">
                                <span class="font-bold text-lg text-yellow-500">${hora}</span>
                                <span class="text-sm font-bold text-yellow-500 uppercase">Seu Horário</span>
                            </div>
                            <div class="text-sm text-gray-300 mt-1">${apt.servicos.map(s => servicosTabela[s].nome).join(' + ')}</div>
                            ${statusHtml}
                        </div>`;
                }
                else {
                    // Agendamento de outra pessoa
                    let viewStatus = `<span class="text-sm font-bold text-yellow-600 uppercase">Agendado</span>`;
                    if(apt.status === 'em_andamento' || apt.status === 'chamado') {
                        viewStatus = `<span class="text-sm font-bold text-orange-500 blinking uppercase border border-orange-500 px-2 py-1 rounded">CORTANDO <span id="timer_pub_${apt.id}"></span></span>`;
                    }
                    html += `
                        <div class="flex items-center justify-between bg-gray-800 border-l-4 border-yellow-700 p-4 rounded-lg opacity-80">
                            <span class="font-bold text-lg text-gray-400">${hora}</span>
                            ${viewStatus}
                        </div>`;
                }
            });
            grid.innerHTML = html;
        }

        window.openClientModal = (hora) => {
            const m = document.createElement('div');
            m.id = 'clientModal';
            m.className = 'fixed inset-0 modal flex items-center justify-center p-4 z-50';
            m.innerHTML = `
                <div class="bg-gray-800 rounded-xl w-full max-w-sm p-6 shadow-2xl border border-gray-700">
                    <h3 class="text-xl font-bold mb-4 text-white text-center">Horário: <span class="text-green-400">${hora}</span></h3>
                    <p class="text-sm text-gray-400 mb-4 text-center">Selecione os serviços:</p>
                    <div class="space-y-3 mb-6">
                        ${Object.keys(servicosTabela).map(k => `
                            <label class="flex items-center justify-between bg-gray-900 p-3 rounded border border-gray-700 cursor-pointer hover:border-gray-500">
                                <div class="flex items-center">
                                    <input type="checkbox" id="srv_${k}" value="${k}" class="w-5 h-5 accent-green-600">
                                    <span class="ml-3 text-white font-medium">${servicosTabela[k].nome}</span>
                                </div>
                                <span class="text-green-400 font-bold">R$ ${servicosTabela[k].preco.toFixed(2)}</span>
                            </label>
                        `).join('')}
                    </div>
                    <div class="flex space-x-3">
                        <button onclick="document.getElementById('clientModal').remove()" class="flex-1 bg-gray-600 hover:bg-gray-500 text-white font-bold py-3 rounded">Cancelar</button>
                        <button onclick="window.confirmClientApt('${hora}')" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded shadow-lg">Confirmar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(m);
        };

        window.confirmClientApt = async (hora) => {
            const servicos = [];
            Object.keys(servicosTabela).forEach(k => {
                if(document.getElementById('srv_' + k).checked) servicos.push(k);
            });
            if(servicos.length === 0) return alert("Selecione pelo menos um serviço.");

            const total = servicos.reduce((sum, s) => sum + servicosTabela[s].preco, 0);

            const docRef = doc(db, "salao_agendamentos", `${selectedDate}_${hora}`);
            await setDoc(docRef, {
                data: selectedDate,
                hora: hora,
                nome: currentUser.nome,
                telefone: currentUser.telefone,
                servicos: servicos,
                valor: total,
                status: 'agendado',
                criadoEm: Date.now()
            });

            document.getElementById('clientModal').remove();
        };

        window.cancelClient = async (id) => {
            if(confirm("Tem certeza que deseja desmarcar? Você perderá a vaga.")) {
                await updateDoc(doc(db, "salao_agendamentos", id), {
                    status: 'desmarcado',
                    nome: 'Desmarcado pelo Cliente',
                    servicos: [],
                    valor: 0
                });
            }
        };

        // --- ADMIN UI ---
        function renderAdmin() {
            document.getElementById('userInfo').innerHTML = `Painel Barbeiro <button onclick="window.logout()" class="ml-2 text-red-500 underline">Sair</button>`;
            document.getElementById('userInfo').classList.remove('hidden');

            const app = document.getElementById('appContent');
            app.innerHTML = `
                <div class="mb-4 flex flex-col sm:flex-row justify-between items-center bg-gray-800 p-4 rounded-lg border border-gray-700 gap-4 shadow-md">
                    <input type="date" id="datePicker" value="${selectedDate}" class="bg-gray-900 border border-gray-600 text-white p-2 rounded w-full sm:w-auto font-bold focus:outline-none focus:border-blue-500" onchange="window.changeDate(this.value)">
                    <div id="caixaControls" class="w-full sm:w-auto text-center"></div>
                </div>
                <div id="adminGrid" class="space-y-3 pb-8"></div>
            `;
            renderAdminAgenda();
        }

        function renderAdminAgenda() {
            const cxCtrl = document.getElementById('caixaControls');
            const grid = document.getElementById('adminGrid');
            if(!cxCtrl || !grid) return;

            if (caixaAtual && caixaAtual.status === 'aberto') {
                cxCtrl.innerHTML = `<button onclick="window.fecharCaixa()" class="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded font-bold shadow">FECHAR CAIXA (R$ ${caixaAtual.saldoInicial.toFixed(2)})</button>`;
            } else {
                cxCtrl.innerHTML = `<button onclick="window.abrirCaixa()" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded font-bold shadow">ABRIR CAIXA DO DIA</button>`;
            }

            const isCadeiraOcupada = dayAppointments.some(a => a.status === 'em_andamento' || a.status === 'chamado');

            let html = '';
            timeSlots.forEach(hora => {
                const apt = dayAppointments.find(a => a.hora === hora);
                if (!apt) {
                    html += `
                        <div class="flex items-center justify-between bg-gray-800 border-l-4 border-green-500 p-4 rounded-lg shadow-sm">
                            <span class="font-bold text-lg">${hora}</span>
                            <span class="text-green-500 font-bold uppercase text-sm">Livre</span>
                        </div>`;
                } else if (apt.status === 'desmarcado') {
                    html += `
                        <div class="flex items-center justify-between bg-gray-900 border-l-4 border-gray-600 p-4 rounded-lg opacity-70">
                            <span class="font-bold text-lg text-gray-500">${hora}</span>
                            <span class="text-sm font-bold text-gray-500 uppercase">Desmarcado</span>
                        </div>`;
                } else if (apt.status === 'finalizado') {
                    html += `
                        <div class="flex items-center justify-between bg-gray-900 border-l-4 border-red-900 p-4 rounded-lg opacity-60">
                            <span class="font-bold text-lg text-gray-400">${hora}</span>
                            <div class="text-right">
                                <div class="font-bold text-red-500 uppercase text-sm">Finalizado</div>
                                <div class="text-xs text-gray-500">${apt.nome} - R$ ${apt.valor.toFixed(2)}</div>
                            </div>
                        </div>`;
                } else {
                    let border = 'border-yellow-500';
                    let bg = 'bg-gray-800';
                    let statusText = 'AGENDADO';
                    let textCol = 'text-yellow-500';
                    
                    if (apt.status === 'chamado') { border = 'border-red-500'; bg = 'bg-red-900'; statusText = 'CHAMADO'; textCol='text-white'; }
                    if (apt.status === 'em_andamento') { border = 'border-orange-500'; bg = 'bg-orange-900'; statusText = 'NA CADEIRA'; textCol='text-white'; }

                    html += `
                        <div class="flex items-center justify-between ${bg} border-l-4 ${border} p-4 rounded-lg shadow cursor-pointer transition hover:brightness-110" onclick="window.openAdminModal('${apt.id}')">
                            <div>
                                <div class="font-bold text-lg ${textCol} flex items-center gap-2">
                                    ${hora} - ${apt.nome} 
                                </div>
                                <div class="text-xs text-gray-300">${apt.telefone} | ${apt.servicos.map(s => servicosTabela[s].nome).join('+')} | R$ ${apt.valor.toFixed(2)}</div>
                            </div>
                            <div class="text-right">
                                <span class="text-xs font-bold ${textCol} uppercase blinking px-2 py-1 bg-black bg-opacity-30 rounded">${statusText}</span>
                                ${apt.status === 'chamado' || apt.status === 'em_andamento' ? `<div id="timer_admin_${apt.id}" class="text-sm font-mono mt-1 ${textCol}"></div>` : ''}
                            </div>
                        </div>`;
                }
            });
            grid.innerHTML = html;
        }

        window.abrirCaixa = async () => {
            // Regra: Bloquear se existir caixa aberto em QUALQUER outra data
            const q = query(collection(db, "salao_caixa"), where("status", "==", "aberto"));
            const snapshot = await getDocs(q);
            let bloqueado = false;
            snapshot.forEach(doc => {
                if (doc.id !== selectedDate) bloqueado = true;
            });
            
            if (bloqueado) {
                return alert("⚠️ ERRO: Você possui um caixa ABERTO em outra data. Feche o caixa antigo antes de abrir um novo dia!");
            }

            const valorStr = prompt("Saldo inicial (Troco na gaveta) em R$:");
            if(valorStr === null) return;
            const valor = parseFloat(valorStr.replace(',','.'));
            if(isNaN(valor)) return alert("Valor inválido.");

            await setDoc(doc(db, "salao_caixa", selectedDate), {
                status: 'aberto',
                saldoInicial: valor,
                abertoEm: Date.now()
            });
        };

        window.fecharCaixa = async () => {
            const finalizados = dayAppointments.filter(a => a.status === 'finalizado');
            const faturamento = finalizados.reduce((sum, a) => sum + a.valor, 0);
            const total = caixaAtual.saldoInicial + faturamento;

            if(confirm(`RESUMO DO DIA:\nTroco Inicial: R$ ${caixaAtual.saldoInicial.toFixed(2)}\nFaturamento: R$ ${faturamento.toFixed(2)}\nTotal em Caixa: R$ ${total.toFixed(2)}\n\nDeseja fechar o caixa?`)) {
                await updateDoc(doc(db, "salao_caixa", selectedDate), {
                    status: 'fechado',
                    faturamento: faturamento,
                    totalFinal: total,
                    fechadoEm: Date.now()
                });
            }
        };

        window.openAdminModal = (id) => {
            const apt = dayAppointments.find(a => a.id === id);
            if(!apt) return;

            const isOcupado = dayAppointments.some(a => (a.status === 'em_andamento' || a.status === 'chamado') && a.id !== apt.id);
            
            let actBtn = '';
            let btnAdiantar = '';

            if (apt.status === 'agendado') {
                if(isOcupado) {
                    actBtn = `<button onclick="alert('Existe outro corte em andamento. Finalize-o primeiro!')" class="w-full bg-gray-700 text-gray-400 font-bold py-4 rounded mb-3 cursor-not-allowed border border-gray-600">CADEIRA OCUPADA</button>`;
                } else {
                    actBtn = `<button onclick="window.updateStatus('${id}', 'chamado')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded mb-3 shadow-lg border border-red-500">CHAMAR CLIENTE (2 min)</button>`;
                }
                
                // Regra: Adiantar Corte (Puxar Fila)
                btnAdiantar = `<button onclick="window.adiantarCorte('${id}', '${apt.hora}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded mb-3 shadow">Adiantar Corte (Puxar Fila)</button>`;
            } 
            else if (apt.status === 'chamado') {
                actBtn = `<button onclick="window.updateStatus('${id}', 'em_andamento')" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded mb-3 shadow-lg text-lg">INICIAR CORTE AGORA</button>`;
            } 
            else if (apt.status === 'em_andamento') {
                actBtn = `<button onclick="window.updateStatus('${id}', 'finalizado')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded mb-3 shadow-lg text-lg">FINALIZAR CORTE E RECEBER</button>`;
            }

            const m = document.createElement('div');
            m.id = 'adminModal';
            m.className = 'fixed inset-0 modal flex items-center justify-center p-4 z-50';
            m.innerHTML = `
                <div class="bg-gray-800 rounded-xl w-full max-w-sm p-6 shadow-2xl border border-gray-600">
                    <h3 class="text-xl font-bold mb-1 text-white">${apt.nome}</h3>
                    <p class="text-sm text-gray-400 mb-4">${apt.telefone}</p>
                    
                    <div class="bg-gray-900 p-4 rounded-lg mb-6 border border-gray-700">
                        <p class="font-bold text-lg text-yellow-500 mb-2">Horário: ${apt.hora}</p>
                        <p class="text-sm text-gray-300">${apt.servicos.map(s => servicosTabela[s].nome).join(' + ')}</p>
                        <p class="text-lg font-bold text-green-400 mt-2">R$ ${apt.valor.toFixed(2)}</p>
                    </div>

                    ${actBtn}
                    ${btnAdiantar}
                    
                    <div class="flex space-x-3 mt-4">
                        <button onclick="document.getElementById('adminModal').remove()" class="flex-1 bg-gray-600 hover:bg-gray-500 text-white font-bold py-3 rounded">Voltar</button>
                        ${apt.status === 'agendado' || apt.status === 'chamado' ? `<button onclick="window.updateStatus('${id}', 'desmarcado')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-red-400 border border-red-900 font-bold py-3 rounded">Faltou / Desmarcar</button>` : ''}
                    </div>
                </div>
            `;
            document.body.appendChild(m);
        };

        window.adiantarCorte = async (id, currentHora) => {
            const currentIndex = timeSlots.indexOf(currentHora);
            let targetHora = null;

            for (let i = currentIndex - 1; i >= 0; i--) {
                const h = timeSlots[i];
                const aptRef = dayAppointments.find(a => a.hora === h);
                if (!aptRef || aptRef.status === 'desmarcado') {
                    targetHora = h;
                    break;
                }
            }

            if (targetHora) {
                if(confirm(`Horário anterior livre encontrado: ${targetHora}.\nDeseja adiantar o corte para este horário?`)) {
                    // Se existia um doc 'desmarcado' naquela hora, ele será sobreposto indiretamente ou fica flutuando.
                    // Para evitar duplicata visual, buscamos o ID do desmarcado e apagamos
                    const oldApt = dayAppointments.find(a => a.hora === targetHora);
                    if(oldApt && oldApt.status === 'desmarcado') {
                        await deleteDoc(doc(db, "salao_agendamentos", oldApt.id));
                    }
                    await updateDoc(doc(db, "salao_agendamentos", id), { hora: targetHora });
                    document.getElementById('adminModal').remove();
                }
            } else {
                alert("Não há horários anteriores livres na fila de hoje.");
            }
        };

        window.updateStatus = async (id, status) => {
            let data = { status };
            if(status === 'chamado') data.chamadoEm = Date.now();
            if(status === 'em_andamento') data.iniciadoEm = Date.now();
            if(status === 'finalizado') data.finalizadoEm = Date.now();
            if(status === 'desmarcado') {
                data.nome = 'Desmarcado';
                data.servicos = [];
                data.valor = 0;
            }
            
            await updateDoc(doc(db, "salao_agendamentos", id), data);
            document.getElementById('adminModal').remove();
        };

        window.changeDate = (val) => {
            selectedDate = val;
            init();
        };

        function updateTimers() {
            dayAppointments.forEach(apt => {
                let elA = document.getElementById(`timer_admin_${apt.id}`);
                let elC = document.getElementById(`timer_${apt.id}`);
                let elP = document.getElementById(`timer_pub_${apt.id}`);
                
                if (apt.status === 'chamado' && apt.chamadoEm) {
                    let left = 120 - Math.floor((Date.now() - apt.chamadoEm)/1000);
                    if(left < 0) left = 0;
                    let min = Math.floor(left / 60);
                    let sec = left % 60;
                    let str = `Tempo: ${min}:${sec.toString().padStart(2, '0')}`;
                    if(elA) elA.innerText = str;
                    if(elC) elC.innerText = str;
                }
                
                if (apt.status === 'em_andamento' && apt.iniciadoEm) {
                    let totalSec = Math.floor((Date.now() - apt.iniciadoEm)/1000);
                    let min = Math.floor(totalSec / 60);
                    let sec = totalSec % 60;
                    let str = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
                    if(elA) elA.innerText = str;
                    if(elC) elC.innerText = str;
                    if(elP) elP.innerText = str;
                }
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
