<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salão do Dê - Alemoa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #fff; }
        .barber-pole {
            background: repeating-linear-gradient(45deg, #dc2626, #dc2626 20px, #ffffff 20px, #ffffff 40px, #000000 40px, #000000 60px);
            background-size: 85px 85px;
            animation: movePole 2s linear infinite;
        }
        @keyframes movePole { 0% { background-position: 0 0; } 100% { background-position: 85px 0; } }
        .pulse-orange { animation: pulseOrange 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulseOrange { 0%, 100% { opacity: 1; border-color: #f97316; } 50% { opacity: .5; border-color: #ea580c; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .flash-red { animation: flashRed 1s infinite; }
        @keyframes flashRed { 0%, 100% { background-color: #991b1b; } 50% { background-color: #dc2626; } }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <div class="h-2 barber-pole w-full fixed top-0 z-50"></div>

    <div id="app" class="flex-1 w-full max-w-5xl mx-auto px-4 py-8 mt-2 mb-10">
        <!-- Conteúdo Injetado via JS -->
    </div>

    <div class="h-2 barber-pole w-full fixed bottom-0 z-50"></div>

    <!-- Container Global de Modais -->
    <div id="modal-container" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="bg-[#171717] rounded-2xl shadow-2xl w-full max-w-md border border-neutral-800 animate-fade-in flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-5 border-b border-neutral-800">
                <h3 id="modal-title" class="font-black text-xl text-white uppercase tracking-wider"></h3>
                <button onclick="closeModal()" class="text-neutral-500 hover:text-white transition-colors">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="modal-body" class="p-5 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Banner "Sua Vez" Gigante para o Cliente -->
    <div id="your-turn-banner" class="fixed inset-0 z-[200] hidden flex-col items-center justify-center bg-red-600 flash-red px-4 text-center">
        <h1 class="text-6xl md:text-8xl font-black text-white uppercase tracking-tighter mb-4 shadow-sm">É a Sua Vez!</h1>
        <p class="text-white text-xl md:text-3xl font-bold mb-8">Dirija-se à cadeira do barbeiro.</p>
        <div class="bg-black/50 rounded-xl p-6 border-4 border-white inline-block">
            <p class="text-white text-sm uppercase tracking-widest mb-2">Tempo de Tolerância</p>
            <div id="your-turn-timer" class="text-5xl md:text-7xl font-black text-white font-mono">02:00</div>
        </div>
        <button onclick="document.getElementById('your-turn-banner').classList.replace('flex', 'hidden')" class="mt-12 bg-white text-red-700 px-8 py-4 rounded-xl font-black uppercase tracking-widest hover:bg-neutral-200 transition">Estou Indo</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyRPstlq91unKjiWmHEktAUXgCtfVWTFU",
            authDomain: "desafio-7-dias-d3680.firebaseapp.com",
            projectId: "desafio-7-dias-d3680",
            storageBucket: "desafio-7-dias-d3680.firebasestorage.app",
            messagingSenderId: "981540824605",
            appId: "1:981540824605:web:f35d6a0616a3bce54308f4",
            measurementId: "G-J7NXMXCQ56"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const SERVICES = [
            { id: 'pezinho', name: 'Pézinho', price: 10 },
            { id: 'corte', name: 'Corte', price: 30 },
            { id: 'barba', name: 'Barba', price: 25 }
        ];
        
        let appointments = [];
        let cashRegisters = [];
        let currentUser = null; // Admin logado via Auth
        let currentClient = JSON.parse(localStorage.getItem('salao_client')) || null; // Cliente Local
        let activeView = 'home';
        let unsubscribeAppointments = null;
        let unsubscribeCash = null;
        let lastNotifiedState = {};
        
        const generateTimeSlots = () => {
            const slots = [];
            for (let h = 8; h <= 18; h++) {
                slots.push(`${h.toString().padStart(2, '0')}:00`);
                slots.push(`${h.toString().padStart(2, '0')}:30`);
            }
            return slots.filter(s => s !== '12:00'); // Pausa almoço
        };
        const TIME_SLOTS = generateTimeSlots();

        window.formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
        window.getToday = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
        
        window.playBeep = (type = 'single') => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const playTone = (freq, time, dur) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, time);
                    gain.gain.setValueAtTime(0.1, time);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(time);
                    osc.stop(time + dur);
                };
                
                if(type === 'single') {
                    playTone(800, ctx.currentTime, 0.2); // Beep agudo curto (Admin)
                } else if (type === 'double') {
                    playTone(1000, ctx.currentTime, 0.15); // Beep chamativo para cliente
                    playTone(1200, ctx.currentTime + 0.2, 0.25);
                }
            } catch(e) {}
        };

        window.showModal = (title, htmlBody) => {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = htmlBody;
            document.getElementById('modal-container').classList.remove('hidden');
            document.getElementById('modal-container').classList.add('flex');
        };
        
        window.closeModal = () => {
            document.getElementById('modal-container').classList.add('hidden');
            document.getElementById('modal-container').classList.remove('flex');
        };

        window.formatPhone = (el) => {
            let v = el.value.replace(/\D/g, "");
            v = v.substring(0, 11);
            if (v.length > 2) v = `(${v.substring(0,2)}) ${v.substring(2)}`;
            if (v.length > 10) v = `${v.substring(0,10)}-${v.substring(10)}`;
            el.value = v;
        };

        window.handleDBError = (err) => {
            console.error("Database Error:", err);
            if(err.code === 'permission-denied' || (err.message && err.message.includes('permission'))) {
                const rulesHtml = `
                    <p class="text-white text-sm mb-4">Seu Firebase está bloqueando o acesso porque exige login, mas os clientes agora usam apenas o telefone.</p>
                    <p class="text-amber-500 font-bold text-sm mb-2">Como Corrigir (Passo a Passo):</p>
                    <ol class="text-neutral-300 text-xs space-y-2 mb-4 list-decimal pl-4">
                        <li>Acesse o Console do Firebase e abra seu projeto.</li>
                        <li>No menu esquerdo, vá em <b>Firestore Database</b>.</li>
                        <li>Clique na aba superior chamada <b>Regras (Rules)</b>.</li>
                        <li>Apague tudo que estiver lá e cole o código abaixo:</li>
                    </ol>
                    <div class="bg-black p-3 rounded-lg border border-neutral-700 overflow-x-auto relative mb-4">
                        <pre class="text-green-500 text-xs font-mono">rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /{document=**} {\n      allow read, write: if true;\n    }\n  }\n}</pre>
                    </div>
                    <button onclick="closeModal()" class="w-full bg-amber-500 text-black font-black py-3 rounded-xl mt-2">Ok, vou lá alterar</button>
                `;
                showModal("Acesso Bloqueado no Firebase", rulesHtml);
            }
        };

        setInterval(() => {
            if(activeView !== 'client' && activeView !== 'admin') return;
            
            appointments.forEach(app => {
                if(app.status === 'started' && app.startedAt) {
                    const el = document.getElementById(`timer-${app.id}`);
                    if(el) {
                        const diff = Math.floor((Date.now() - app.startedAt) / 1000);
                        const m = String(Math.floor(diff / 60)).padStart(2, '0');
                        const s = String(diff % 60).padStart(2, '0');
                        el.innerText = `${m}:${s}`;
                    }
                }
                if(app.status === 'called' && app.calledAt) {
                    const el = document.getElementById(`timer-${app.id}`);
                    if(el) {
                        const passed = Math.floor((Date.now() - app.calledAt) / 1000);
                        const remain = Math.max(0, 120 - passed);
                        const m = String(Math.floor(remain / 60)).padStart(2, '0');
                        const s = String(remain % 60).padStart(2, '0');
                        el.innerText = `${m}:${s}`;
                        
                        if (currentClient && app.clientPhone === currentClient.phone && remain > 0) {
                            const bannerTimer = document.getElementById('your-turn-timer');
                            if(bannerTimer) bannerTimer.innerText = `${m}:${s}`;
                        }
                    }
                }
            });
            
            if(activeView === 'client' && currentClient) {
                const today = window.getToday();
                const myTodayApps = appointments.filter(a => a.date === today && a.clientPhone === currentClient.phone);
                
                myTodayApps.forEach(myApp => {
                    if(myApp.status === 'called' && lastNotifiedState[myApp.id] !== 'called') {
                        lastNotifiedState[myApp.id] = 'called';
                        window.playBeep('double');
                        document.getElementById('your-turn-banner').classList.remove('hidden');
                        document.getElementById('your-turn-banner').classList.add('flex');
                    }
                    
                    if (myApp.status === 'booked') {
                        const activeApp = appointments.find(a => a.date === today && a.status === 'started');
                        if (activeApp) {
                            const diffMinutes = Math.floor((Date.now() - activeApp.startedAt) / 1000 / 60);
                            const hasHaircut = activeApp.services.includes('corte') || activeApp.services.includes('barba');
                            const triggerMin = hasHaircut ? 15 : 5;
                            
                            const sortedBooked = appointments.filter(a=>a.date === today && a.status === 'booked').sort((a,b) => a.time.localeCompare(b.time));
                            const isNext = sortedBooked.length > 0 && sortedBooked[0].id === myApp.id;

                            if(isNext && diffMinutes >= triggerMin && lastNotifiedState[myApp.id] !== 'prepare') {
                                lastNotifiedState[myApp.id] = 'prepare';
                                window.playBeep('double');
                                setTimeout(() => {
                                   showModal("Prepare-se!", `<div class='text-center'><p class='text-amber-500 font-bold mb-3'>O corte atual já está finalizando.</p><p class='text-white'>Aproxime-se do salão, você será o próximo a ser chamado!</p><button onclick='closeModal()' class='mt-6 bg-amber-500 text-black px-6 py-3 rounded-xl font-bold w-full'>Ok, estou pronto</button></div>`);
                                }, 1000);
                            }
                        }
                    }
                });
            }
        }, 1000);

        const listenToData = () => {
            if(unsubscribeAppointments) unsubscribeAppointments();
            if(unsubscribeCash) unsubscribeCash();

            try {
                unsubscribeAppointments = onSnapshot(collection(db, 'salao_agendamentos'), (snap) => {
                    const newApps = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    if (activeView === 'admin' && appointments.length > 0) {
                        const added = newApps.length > appointments.length;
                        if(added) window.playBeep('single');
                    }
                    
                    if(activeView === 'client' && currentClient) {
                        const justFinished = appointments.find(old => old.status === 'started' && newApps.find(n => n.id === old.id)?.status === 'completed');
                        if(justFinished) {
                            const today = window.getToday();
                            const sortedBooked = newApps.filter(a => a.date === today && a.status === 'booked').sort((a,b) => a.time.localeCompare(b.time));
                            if(sortedBooked.length > 0 && sortedBooked[0].clientPhone === currentClient.phone) {
                                window.playBeep('double');
                                showModal("A Cadeira Vaziou!", "<div class='text-center'><p class='text-white mb-4'>O barbeiro finalizou o cliente anterior. Fique atento, você será chamado a qualquer momento!</p><button onclick='closeModal()' class='w-full bg-green-500 text-black font-black py-4 rounded-xl'>Estou Atento</button></div>");
                            }
                        }
                    }

                    appointments = newApps;
                    if(activeView === 'client') renderClient();
                    if(activeView === 'admin') renderAdmin();
                }, (err) => handleDBError(err));

                unsubscribeCash = onSnapshot(collection(db, 'salao_caixa'), (snap) => {
                    cashRegisters = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    if(activeView === 'admin') renderAdmin();
                }, (err) => handleDBError(err));
            } catch(e) {
                handleDBError(e);
            }
        };

        onAuthStateChanged(auth, (u) => {
            currentUser = u;
            if(u && u.email) { 
                listenToData(); 
                nav('admin');
            }
        });

        window.nav = (view) => { activeView = view; renderApp(); };

        window.clientEnter = async (e) => {
            e.preventDefault();
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            
            if(name.length < 2 || phone.length < 14) {
                return showModal("Atenção", "<p class='text-white'>Preencha um nome e um WhatsApp válido.</p>");
            }
            
            try {
                // Tenta logar anonimamente caso o Firebase tenha a autenticação anônima ligada (Bypass de algumas regras)
                try { await signInAnonymously(auth); } catch(e) {}

                // Salva o cliente e prossegue
                await setDoc(doc(collection(db, 'salao_clientes'), phone.replace(/\D/g, '')), { name, phone, lastAccess: Date.now() });
                
                currentClient = { name, phone };
                localStorage.setItem('salao_client', JSON.stringify(currentClient));
                listenToData();
                nav('client');
            } catch (err) { 
                handleDBError(err);
            }
        };
        
        window.clientLogout = () => {
            currentClient = null;
            localStorage.removeItem('salao_client');
            nav('home');
        };

        window.adminLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                // Nav is handled by onAuthStateChanged
            } catch (err) { 
                showModal("Acesso Negado", "<p class='text-red-500 font-bold mb-2'>Senha Incorreta ou E-mail Inválido.</p><p class='text-white text-sm'>Verifique suas credenciais do Firebase.</p>"); 
            }
        };
        
        window.doAdminLogout = async () => {
            await signOut(auth);
            nav('home');
        };

        window.tempSelectedServices = [];
        window.toggleTempService = (id) => {
            const idx = tempSelectedServices.indexOf(id);
            if(idx > -1) tempSelectedServices.splice(idx, 1);
            else tempSelectedServices.push(id);
            
            document.querySelectorAll('.srv-btn').forEach(btn => {
                const sId = btn.getAttribute('data-id');
                if(tempSelectedServices.includes(sId)) {
                    btn.classList.add('border-amber-500', 'bg-amber-900/40', 'text-amber-500');
                    btn.classList.remove('border-neutral-700', 'text-neutral-400');
                } else {
                    btn.classList.remove('border-amber-500', 'bg-amber-900/40', 'text-amber-500');
                    btn.classList.add('border-neutral-700', 'text-neutral-400');
                }
            });
            const total = tempSelectedServices.reduce((acc, sId) => acc + (SERVICES.find(s=>s.id===sId)?.price||0), 0);
            const totalEl = document.getElementById('modal-total');
            if(totalEl) totalEl.innerText = formatCurrency(total);
        };

        window.clientBookSlot = (time, date) => {
            tempSelectedServices = [];
            const html = `
                <p class="text-neutral-400 text-sm mb-4">Escolha os serviços para <b>${time}</b>:</p>
                <div class="space-y-3 mb-6">
                    ${SERVICES.map(s => `
                        <div onclick="toggleTempService('${s.id}')" data-id="${s.id}" class="srv-btn cursor-pointer border border-neutral-700 rounded-xl p-4 flex justify-between items-center transition-all">
                            <span class="font-bold">${s.name}</span>
                            <span class="text-white">${formatCurrency(s.price)}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="flex justify-between items-center mb-6 bg-neutral-900 p-4 rounded-xl border border-neutral-800">
                    <span class="text-neutral-400 text-sm uppercase tracking-widest font-bold">Total</span>
                    <span id="modal-total" class="text-2xl font-black text-amber-500">R$ 0,00</span>
                </div>
                <button onclick="confirmClientBook('${time}', '${date}')" class="w-full bg-amber-500 text-black font-black py-4 rounded-xl shadow-[0_0_15px_rgba(245,158,11,0.3)]">Confirmar Agendamento</button>
            `;
            showModal(`Agendar ${time}`, html);
        };

        window.confirmClientBook = async (time, date) => {
            if(tempSelectedServices.length === 0) return alert("Selecione um serviço");
            const total = tempSelectedServices.reduce((acc, sId) => acc + (SERVICES.find(s=>s.id===sId)?.price||0), 0);
            try {
                await addDoc(collection(db, 'salao_agendamentos'), {
                    date, time,
                    services: tempSelectedServices,
                    totalPrice: total,
                    status: 'booked',
                    clientName: currentClient.name,
                    clientPhone: currentClient.phone,
                    createdAt: Date.now()
                });
                closeModal();
            } catch (err) { handleDBError(err); }
        };

        window.tryUpdate = async (id, data) => {
            try { await updateDoc(doc(db, 'salao_agendamentos', id), data); closeModal(); } catch(e){ handleDBError(e); }
        };
        window.tryDelete = async (id) => {
            try { await deleteDoc(doc(db, 'salao_agendamentos', id)); closeModal(); } catch(e){ handleDBError(e); }
        };

        window.adminManageSlot = (appIdStr, dateStr) => {
            const app = appointments.find(a => a.id === appIdStr);
            if(!app) return;
            
            const activeCut = appointments.find(a => a.date === dateStr && a.status === 'started' && a.id !== app.id);

            if(app.status === 'completed') {
                return showModal("Finalizado", "<p class='text-neutral-400'>Serviço já prestado.</p>");
            }

            const svcNames = app.services.map(id => SERVICES.find(s=>s.id===id)?.name).join(' + ');
            
            let body = `
                <div class="bg-black/50 border border-neutral-800 p-5 rounded-xl mb-6">
                    <h4 class="font-black text-2xl text-amber-500 mb-1">${app.time} - ${app.clientName}</h4>
                    <p class="text-neutral-400 text-sm mb-3">${app.clientPhone}</p>
                    <p class="text-white text-sm mb-2">Serviços: <span class="font-bold text-amber-500">${svcNames}</span></p>
                    <p class="text-white text-sm">Valor: <span class="font-bold text-green-500">${formatCurrency(app.totalPrice)}</span></p>
                </div>
            `;
            
            let btns = '';
            if (app.status === 'booked') {
                btns = `
                    <button onclick="tryUpdate('${app.id}', {status: 'called', calledAt: Date.now()})" class="w-full bg-orange-600 text-white font-black py-4 rounded-xl mb-3">Chamar Cliente (2 min)</button>
                    <button onclick="tryDelete('${app.id}')" class="w-full bg-transparent border border-red-900 text-red-500 py-3 rounded-xl font-bold">Desmarcar / Faltou</button>
                `;
            } else if (app.status === 'called') {
                let startBtn = activeCut 
                    ? `<button onclick="alert('Existe um corte em andamento. Finalize-o primeiro!')" class="w-full bg-neutral-800 text-neutral-500 font-black py-4 rounded-xl mb-3 border border-neutral-700 cursor-not-allowed">Cadeira Ocupada no Momento</button>`
                    : `<button onclick="tryUpdate('${app.id}', {status: 'started', startedAt: Date.now()})" class="w-full bg-red-600 text-white font-black py-4 rounded-xl mb-3 flash-red">O Cliente Sentou! (Iniciar Tempo)</button>`;
                
                btns = `
                    ${startBtn}
                    <button onclick="tryDelete('${app.id}')" class="w-full bg-transparent border border-red-900 text-red-500 py-3 rounded-xl font-bold">Pular Vez</button>
                `;
            } else if (app.status === 'started') {
                btns = `
                    <button onclick="tryUpdate('${app.id}', {status: 'completed'})" class="w-full bg-green-600 text-white font-black py-5 rounded-xl shadow-[0_0_20px_rgba(22,163,74,0.4)]">Finalizar Corte e Somar ao Caixa</button>
                `;
            }
            showModal("Gerenciar Horário", body + btns);
        };

        window.openDayAdmin = (existingId = null) => {
            const dateStr = document.getElementById('admin-date').value;
            const idArg = existingId ? `'${existingId}'` : 'null';
            const html = `
                <p class="text-neutral-400 text-sm mb-4">Insira o saldo inicial na gaveta (Troco) para o dia ${dateStr.split('-').reverse().join('/')}.</p>
                <input type="number" id="saldo-inicial" placeholder="R$ 0,00" class="w-full p-4 bg-neutral-900 border border-neutral-700 rounded-xl text-white text-2xl font-bold mb-6 text-center outline-none focus:border-amber-500">
                <button onclick="confirmOpenDay('${dateStr}', ${idArg})" class="w-full bg-amber-500 text-black font-black py-4 rounded-xl">Abrir Caixa</button>
            `;
            showModal("Abrir o Dia", html);
        };

        window.confirmOpenDay = async (dateStr, existingId) => {
            const val = parseFloat(document.getElementById('saldo-inicial').value || 0);
            try {
                if (existingId) {
                    await updateDoc(doc(db, 'salao_caixa', existingId), { initialBalance: val, status: 'open', reopenedAt: Date.now() });
                } else {
                    await addDoc(collection(db, 'salao_caixa'), { date: dateStr, initialBalance: val, status: 'open', openedAt: Date.now() });
                }
                closeModal();
            } catch(e) { handleDBError(e); }
        };

        window.closeDayAdmin = (cashId, dateStr, faturamento, total) => {
            const html = `
                <div class="bg-neutral-900 border border-neutral-800 p-5 rounded-xl mb-6">
                    <p class="text-neutral-500 text-sm mb-1 uppercase tracking-widest">Resumo do Caixa</p>
                    <div class="flex justify-between mt-4 text-sm text-neutral-300"><span>Faturamento:</span> <span>${formatCurrency(faturamento)}</span></div>
                    <div class="flex justify-between mt-2 mb-4 text-sm text-neutral-300 border-b border-neutral-800 pb-4"><span>Troco Inicial:</span> <span>${formatCurrency(total - faturamento)}</span></div>
                    <div class="flex justify-between items-center"><span class="font-bold">Total na Gaveta:</span> <span class="text-2xl font-black text-green-500">${formatCurrency(total)}</span></div>
                </div>
                <button onclick="tryUpdateBox('${cashId}', {status: 'closed', closedAt: Date.now()})" class="w-full bg-red-600 text-white font-black py-4 rounded-xl">Confirmar e Fechar o Dia</button>
            `;
            showModal(`Encerrar ${dateStr.split('-').reverse().join('/')}`, html);
        };
        window.tryUpdateBox = async (id, data) => { try { await updateDoc(doc(db, 'salao_caixa', id), data); closeModal(); } catch(e){ handleDBError(e); } };

        window.renderApp = () => {
            const appDiv = document.getElementById('app');
            if (activeView === 'home') appDiv.innerHTML = renderHome();
            else if (activeView === 'clientLogin') appDiv.innerHTML = renderClientLogin();
            else if (activeView === 'client') appDiv.innerHTML = buildClientUI();
            else if (activeView === 'adminLogin') appDiv.innerHTML = renderAdminLogin();
            else if (activeView === 'admin') appDiv.innerHTML = buildAdminUI();
            
            if(activeView === 'client') {
                document.getElementById('client-date').addEventListener('change', renderClient);
                renderClient();
            }
            if(activeView === 'admin') {
                document.getElementById('admin-date').addEventListener('change', renderAdmin);
                renderAdmin();
            }
        };

        const renderHome = () => `
            <div class="flex flex-col items-center justify-center min-h-[70vh] text-center animate-fade-in">
                <div class="w-32 h-32 bg-[#111] rounded-full flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(245,158,11,0.15)] border border-neutral-800">
                    <span class="text-5xl">💈</span>
                </div>
                <h1 class="text-5xl font-black text-white uppercase tracking-widest mb-2">Salão do Dê</h1>
                <p class="text-neutral-500 tracking-widest text-sm uppercase mb-12">Alemoa</p>
                
                <div class="flex flex-col w-full max-w-sm gap-4">
                    <button onclick="nav('clientLogin')" class="bg-amber-500 text-black font-black py-5 px-6 rounded-2xl hover:-translate-y-1 transition transform uppercase tracking-wider">Agendar Corte</button>
                    <button onclick="nav('adminLogin')" class="bg-transparent border border-neutral-800 text-neutral-500 font-bold py-4 px-6 rounded-2xl hover:text-white transition">Acesso Barbeiro</button>
                </div>
            </div>
        `;

        const renderClientLogin = () => `
            <div class="max-w-md mx-auto mt-10 bg-[#111] p-8 rounded-3xl border border-neutral-800 shadow-2xl animate-fade-in">
                <h2 class="text-3xl font-black text-white mb-2 uppercase">Agendar Corte</h2>
                <p class="text-neutral-500 text-sm mb-8">Digite seu nome e número para ver os horários disponíveis na agenda.</p>
                <form onsubmit="clientEnter(event)" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-neutral-500 uppercase tracking-widest mb-2">Seu Nome</label>
                        <input type="text" id="client-name" placeholder="Como gosta de ser chamado" class="w-full bg-black border border-neutral-800 rounded-xl p-4 text-white focus:border-amber-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-neutral-500 uppercase tracking-widest mb-2">WhatsApp</label>
                        <input type="tel" id="client-phone" placeholder="(13) 90000-0000" oninput="formatPhone(this)" class="w-full bg-black border border-neutral-800 rounded-xl p-4 text-white focus:border-amber-500 outline-none" required>
                    </div>
                    <button type="submit" class="w-full bg-amber-500 text-black font-black py-4 rounded-xl mt-4 uppercase tracking-wider hover:bg-amber-400 transition">Ver Agenda</button>
                </form>
                <button onclick="nav('home')" class="w-full text-neutral-600 font-bold mt-6 text-sm hover:text-white transition">Voltar</button>
            </div>
        `;

        const renderAdminLogin = () => `
            <div class="max-w-md mx-auto mt-10 bg-[#111] p-8 rounded-3xl border border-neutral-800 shadow-2xl animate-fade-in">
                <h2 class="text-3xl font-black text-white mb-2 uppercase">Área Restrita</h2>
                <p class="text-neutral-500 text-sm mb-8">Login do Administrador (E-mail e Senha).</p>
                <form onsubmit="adminLogin(event)" class="space-y-5">
                    <input type="email" id="admin-email" placeholder="E-mail" class="w-full bg-black border border-neutral-800 rounded-xl p-4 text-white focus:border-neutral-500 outline-none" required>
                    <input type="password" id="admin-pass" placeholder="Senha" class="w-full bg-black border border-neutral-800 rounded-xl p-4 text-white focus:border-neutral-500 outline-none" required>
                    <button type="submit" class="w-full bg-white text-black font-black py-4 rounded-xl mt-4 uppercase tracking-wider">Acessar Sistema</button>
                </form>
                <button onclick="nav('home')" class="w-full text-neutral-600 font-bold mt-6 text-sm hover:text-white transition">Voltar</button>
            </div>
        `;

        const buildClientUI = () => `
            <div class="animate-fade-in max-w-2xl mx-auto">
                <div class="flex justify-between items-center mb-8 border-b border-neutral-800 pb-6">
                    <div>
                        <h2 class="text-2xl font-black text-white">Olá, <span class="text-amber-500">${currentClient?.name.split(' ')[0]}</span>!</h2>
                        <p class="text-neutral-500 text-sm mt-1">${currentClient?.phone}</p>
                    </div>
                    <button onclick="clientLogout()" class="bg-neutral-900 border border-neutral-700 text-neutral-400 px-4 py-2 rounded-lg text-sm hover:text-white font-bold transition">Sair</button>
                </div>
                
                <div class="mb-6">
                    <label class="block text-xs font-bold text-neutral-500 uppercase tracking-widest mb-2">Para qual dia?</label>
                    <input type="date" id="client-date" min="${getToday()}" value="${getToday()}" class="w-full bg-[#111] border border-neutral-800 rounded-xl p-4 text-xl text-white font-bold outline-none focus:border-amber-500 cursor-pointer text-center">
                </div>
                
                <div id="client-grid" class="mt-6"></div>
                <div id="client-my-apps" class="mt-10 border-t border-neutral-800 pt-8"></div>
            </div>
        `;

        window.renderClient = () => {
            const dateStr = document.getElementById('client-date').value;
            const dayObj = new Date(dateStr + "T00:00:00");
            const dayOfWeek = dayObj.getDay();
            
            const gridEl = document.getElementById('client-grid');
            if(dayOfWeek === 0 || dayOfWeek === 1) {
                gridEl.innerHTML = `<div class="text-center py-10 text-neutral-500 font-bold bg-neutral-900 rounded-xl">O salão não abre de Domingo e Segunda.</div>`;
                return;
            }

            const dayApps = appointments.filter(a => a.date === dateStr);
            
            const gridEl = document.getElementById('client-grid');
            if(dayOfWeek === 0 || dayOfWeek === 1) {
                gridEl.innerHTML = `<div class="text-center py-10 text-neutral-500 font-bold bg-neutral-900 rounded-xl">O salão não abre de Domingo e Segunda.</div>`;
                return;
            }

            let html = `<div class="grid grid-cols-3 sm:grid-cols-4 gap-3">`;
            TIME_SLOTS.forEach(time => {
                const app = dayApps.find(a => a.time === time);
                if(!app) {
                    html += `<button onclick="clientBookSlot('${time}', '${dateStr}')" class="bg-green-500/10 border border-green-900/50 hover:bg-green-500 hover:text-black text-green-500 font-black py-4 rounded-xl transition-all shadow-sm">${time}</button>`;
                } else if(app.status === 'completed') {
                    html += `<div class="bg-neutral-900 border border-red-900/30 text-red-500/50 font-black py-4 rounded-xl text-center line-through cursor-not-allowed select-none flex flex-col justify-center items-center"><span class="text-lg">${time}</span><span class="text-[9px] uppercase tracking-widest mt-1">Finalizado</span></div>`;
                } else if(app.status === 'started' || app.status === 'called') {
                    html += `<div class="bg-orange-600 border border-orange-500 text-white font-black py-3 rounded-xl text-center pulse-orange flex flex-col justify-center items-center cursor-not-allowed shadow-[0_0_15px_rgba(234,88,12,0.3)]">
                        <span class="text-lg leading-none">${time}</span>
                        <span class="text-[10px] uppercase font-bold tracking-widest mt-1">Cortando</span>
                        <span id="timer-${app.id}" class="text-xs font-mono bg-black/40 px-2 py-0.5 rounded mt-1">00:00</span>
                    </div>`;
                } else {
                    const isMine = app.clientPhone === currentClient.phone;
                    if(isMine) {
                        html += `<div class="bg-amber-500 text-black font-black py-4 rounded-xl text-center flex flex-col justify-center items-center relative overflow-hidden"><span class="text-lg">${time}</span><span class="text-[9px] uppercase tracking-widest mt-1">Seu Horário</span></div>`;
                    } else {
                        html += `<div class="bg-neutral-900 border border-amber-900/50 text-amber-500/60 font-black py-4 rounded-xl text-center cursor-not-allowed flex flex-col justify-center items-center"><span class="text-lg">${time}</span><span class="text-[9px] uppercase tracking-widest mt-1">Ocupado</span></div>`;
                    }
                }
            });
            html += `</div>`;
            
            html += `<div class="flex justify-center gap-4 mt-6 text-[10px] font-bold uppercase tracking-widest text-neutral-500 flex-wrap">
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-green-500"></span> Livre</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500"></span> Agendado</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-orange-600 pulse-orange border border-orange-400"></span> Cortando</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-red-900"></span> Finalizado</div>
            </div>`;
            
            gridEl.innerHTML = html;

            const myApps = appointments.filter(a => a.clientPhone === currentClient.phone && a.status !== 'completed').sort((a,b)=>a.date.localeCompare(b.date));
            const myAppsEl = document.getElementById('client-my-apps');
            if(myApps.length > 0) {
                let mHtml = `<h3 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Meus Agendamentos Ativos</h3><div class="space-y-3">`;
                myApps.forEach(ma => {
                    mHtml += `
                        <div class="bg-[#111] border-l-4 ${ma.status === 'started' || ma.status==='called' ? 'border-orange-500' : 'border-amber-500'} border-neutral-800 border-y border-r p-4 rounded-xl flex justify-between items-center">
                            <div>
                                <p class="font-black text-white text-lg">${ma.date.split('-').reverse().join('/')} <span class="text-neutral-500 ml-2">às</span> <span class="text-amber-500 ml-1">${ma.time}</span></p>
                                <p class="text-xs text-neutral-400 mt-1 uppercase tracking-wider">${ma.services.map(id => SERVICES.find(s=>s.id===id)?.name).join(' + ')}</p>
                            </div>
                            ${ma.status === 'booked' ? `<button onclick="tryDelete('${ma.id}')" class="bg-neutral-900 border border-neutral-700 text-red-500 font-bold px-4 py-2 text-sm rounded-lg hover:bg-red-900/20 transition">Cancelar</button>` : `<span class="text-orange-500 font-bold text-xs uppercase animate-pulse">Na Vez!</span>`}
                        </div>
                    `;
                });
                mHtml += `</div>`;
                myAppsEl.innerHTML = mHtml;
            } else {
                myAppsEl.innerHTML = '';
            }
        };

        const buildAdminUI = () => `
            <div class="animate-fade-in w-full">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 bg-[#111] p-5 rounded-2xl border border-neutral-800 gap-4">
                    <div>
                        <h2 class="text-xl font-black text-white uppercase tracking-widest flex items-center gap-3">
                            <span class="w-3 h-3 rounded-full bg-red-600 flash-red block"></span>
                            Painel de Controle
                        </h2>
                        <p class="text-neutral-500 text-sm mt-1">Gerenciamento do Salão</p>
                    </div>
                    <div class="flex gap-3 w-full md:w-auto">
                        <input type="date" id="admin-date" value="${getToday()}" class="bg-black border border-neutral-700 rounded-xl p-3 text-white font-bold outline-none focus:border-white flex-1 md:flex-none cursor-pointer">
                        <button onclick="doAdminLogout()" class="bg-neutral-900 border border-neutral-700 text-neutral-400 px-4 py-3 rounded-xl font-bold hover:text-white transition">Sair</button>
                    </div>
                </div>
                
                <div id="admin-dashboard-metrics" class="mb-8"></div>
                <div id="admin-grid" class="bg-[#111] p-5 rounded-2xl border border-neutral-800 shadow-xl"></div>
            </div>
        `;

        window.renderAdmin = () => {
            const dateStr = document.getElementById('admin-date').value;
            const dayApps = appointments.filter(a => a.date === dateStr);
            const caixaForDay = cashRegisters.find(c => c.date === dateStr);
            
            const completedApps = dayApps.filter(a => a.status === 'completed');
            const faturamento = completedApps.reduce((sum, a) => sum + (a.totalPrice||0), 0);
            const totalEmCaixa = caixaForDay ? (caixaForDay.initialBalance + faturamento) : 0;

            const metricsEl = document.getElementById('admin-dashboard-metrics');
            
            if(!caixaForDay || caixaForDay.status === 'closed') {
                metricsEl.innerHTML = `
                    <div class="bg-amber-500/10 border border-amber-500/30 p-6 rounded-2xl text-center mb-6">
                        <h3 class="text-amber-500 font-black text-2xl uppercase tracking-widest mb-2">Caixa Fechado</h3>
                        <p class="text-neutral-400 text-sm mb-6">Faturamento do dia: <span class="text-green-500 font-bold">${formatCurrency(faturamento)}</span></p>
                        <button onclick="openDayAdmin(${caixaForDay ? `'${caixaForDay.id}'` : null})" class="bg-amber-500 text-black font-black px-8 py-4 rounded-xl shadow-lg uppercase tracking-wider">Abrir Caixa</button>
                    </div>
                `;
            } else {
                metricsEl.innerHTML = `
                    <div class="flex flex-col md:flex-row gap-4 mb-6">
                        <div class="flex-1 bg-neutral-900 border border-neutral-800 p-5 rounded-2xl">
                            <p class="text-neutral-500 text-xs font-bold uppercase tracking-widest mb-1">Total na Gaveta (Caixa)</p>
                            <p class="text-3xl font-black text-green-500">${formatCurrency(totalEmCaixa)}</p>
                        </div>
                        <div class="flex-1 bg-neutral-900 border border-neutral-800 p-5 rounded-2xl flex flex-col justify-center items-start">
                            <p class="text-neutral-500 text-xs font-bold uppercase tracking-widest mb-2">Ações do Dia</p>
                            <button onclick="closeDayAdmin('${caixaForDay.id}', '${dateStr}', ${faturamento}, ${totalEmCaixa})" class="text-red-500 border border-red-900/50 hover:bg-red-900/20 font-bold px-4 py-2 text-sm rounded-lg transition uppercase tracking-wider">Fechar Caixa</button>
                        </div>
                    </div>
                `;
            }

            let html = `<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">`;
            TIME_SLOTS.forEach(time => {
                const app = dayApps.find(a => a.time === time);
                if(!app) {
                    html += `<div class="bg-black border border-neutral-800 text-neutral-600 font-bold p-4 rounded-xl flex flex-col justify-between h-24">
                        <span class="text-xl font-black">${time}</span>
                        <span class="text-[10px] uppercase tracking-widest text-green-500/50">Livre</span>
                    </div>`;
                } else {
                    let bgClass = '', statusText = '', extraHTML = '';
                    if(app.status === 'completed') {
                        bgClass = "bg-neutral-900 border-red-900/30 text-neutral-500 opacity-60 line-through";
                        statusText = "Finalizado";
                    } else if (app.status === 'started' || app.status === 'called') {
                        bgClass = "bg-orange-600 border-orange-500 text-white pulse-orange shadow-[0_0_15px_rgba(234,88,12,0.3)] cursor-pointer";
                        statusText = app.status === 'started' ? "Na Cadeira" : "Chamado";
                        extraHTML = `<div id="timer-${app.id}" class="text-xs font-mono bg-black/40 px-2 py-0.5 rounded inline-block mt-1">00:00</div>`;
                    } else {
                        bgClass = "bg-amber-400 border-amber-300 text-black cursor-pointer hover:-translate-y-1 transition transform shadow-md";
                        statusText = "Agendado";
                    }

                    html += `<div onclick="adminManageSlot('${app.id}', '${dateStr}')" class="border p-3 rounded-xl flex flex-col justify-between h-24 ${bgClass}">
                        <div class="flex justify-between items-start leading-none">
                            <span class="text-lg font-black">${time}</span>
                        </div>
                        <div>
                            <span class="block font-black text-sm truncate uppercase tracking-tight ${app.status==='completed'?'text-neutral-500':'opacity-90'}">${app.clientName}</span>
                            ${extraHTML || `<span class="text-[9px] uppercase font-bold opacity-75 truncate block mt-0.5 tracking-widest">${statusText}</span>`}
                        </div>
                    </div>`;
                }
            });
            html += `</div>`;
            document.getElementById('admin-grid').innerHTML = html;
        };

        if(currentClient) {
            listenToData();
            nav('client');
        } else {
            nav('home');
        }
        
    </script>
</body>
</html>
