<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuitandaManager - PDV Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app" class="hidden">
        <nav class="bg-white border-b p-4 flex justify-between items-center shadow-sm">
            <h1 class="font-bold text-green-600 text-xl">QuitandaManager</h1>
            <div id="nav-menu" class="flex gap-4">
                <button onclick="changeTab('pdv')" class="text-gray-700 font-semibold hover:text-green-600">PDV</button>
                <button id="estoque-tab" onclick="changeTab('estoque')" class="hidden text-gray-700 hover:text-green-600">Estoque</button>
                <button id="caixa-tab" onclick="changeTab('caixa')" class="hidden text-gray-700 hover:text-green-600">Caixa</button>
                <button onclick="logout()" class="text-red-500 hover:text-red-700">Sair</button>
            </div>
        </nav>
        <main id="main-content" class="p-6 max-w-7xl mx-auto"></main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM6eLPCIO6NAwv6jRRmSh3YppohWcFILM",
            authDomain: "sistema-mini-mercado.firebaseapp.com",
            projectId: "sistema-mini-mercado",
            storageBucket: "sistema-mini-mercado.firebasestorage.app",
            messagingSenderId: "956443578773",
            appId: "1:956443578773:web:202d968d3787ed7bdba69c",
            measurementId: "G-RMY289M8X1"
        };
        const ADMIN_EMAILS = ["seuemail@gmail.com"]; // SUBSTITUA PELO SEU EMAIL

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let products = [];
        let currentTab = 'pdv';

        onAuthStateChanged(auth, u => {
            if(u) {
                document.getElementById('app').classList.remove('hidden');
                if(ADMIN_EMAILS.includes(u.email)) {
                    document.getElementById('estoque-tab').classList.remove('hidden');
                    document.getElementById('caixa-tab').classList.remove('hidden');
                }
                changeTab('pdv');
            }
        });

        window.changeTab = (t) => {
            currentTab = t;
            const main = document.getElementById('main-content');
            if(t === 'pdv') renderPDV(main);
            else if(t === 'estoque') main.innerHTML = '<h2>Estoque (Painel Admin)</h2>';
            else if(t === 'caixa') main.innerHTML = '<h2>Caixa (Painel Admin)</h2>';
        };

        window.renderPDV = (el) => {
            el.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2">
                        <div id="pdv-ui" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow">
                        <h2 class="font-bold text-lg mb-4">Carrinho</h2>
                        <div id="cart-list" class="space-y-2 mb-4"></div>
                        <button onclick="finalizarVenda()" class="w-full bg-green-600 text-white p-3 rounded font-bold">Pagar</button>
                    </div>
                </div>
            `;
            // Categoria mock
            const cats = ['Hortifruti', 'Bebidas', 'Padaria'];
            const ui = document.getElementById('pdv-ui');
            cats.forEach(c => {
                ui.innerHTML += `<div class="p-6 bg-white border rounded-lg cursor-pointer hover:shadow-lg transition-all">${c}</div>`;
            });
        };

        window.logout = () => signOut(auth);
    </script>
</body>
</html>
