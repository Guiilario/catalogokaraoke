<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuitandaManager - PDV e Estoque</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- HTML5 QRCode Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hide scrollbar for cleaner UI in cart */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="text-gray-900 antialiased min-h-screen flex flex-col">

    <!-- NOVO: Tela de Login -->
    <div id="login-container" class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8 fade-in">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-md border border-gray-200">
            <div>
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100">
                    <i data-lucide="lock" class="h-6 w-6 text-green-600"></i>
                </div>
                <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Acesso Restrito</h2>
                <p class="mt-2 text-center text-sm text-gray-600">QuitandaManager Admin</p>
            </div>
            <form class="mt-8 space-y-6" onsubmit="processLogin(event)">
                <div class="rounded-md shadow-sm -space-y-px">
                    <div>
                        <label for="email-address" class="sr-only">E-mail</label>
                        <input id="email-address" name="email" type="email" required class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-lg focus:outline-none focus:ring-green-500 focus:border-green-500 focus:z-10 sm:text-sm" placeholder="E-mail administrador">
                    </div>
                    <div>
                        <label for="password" class="sr-only">Senha</label>
                        <input id="password" name="password" type="password" required class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-lg focus:outline-none focus:ring-green-500 focus:border-green-500 focus:z-10 sm:text-sm" placeholder="Senha">
                    </div>
                </div>
                <div>
                    <button type="submit" id="btn-login" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors shadow-sm font-bold">
                        Entrar no Sistema
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- O App agora começa escondido com a classe "hidden" e recebe um ID -->
    <header id="app-header" class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10 hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-green-600 p-2 rounded-lg text-white">
                        <i data-lucide="package" class="w-6 h-6"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900 tracking-tight">QuitandaManager</h1>
                </div>
                <!-- NOVO: Container de botões com botão "Sair" -->
                <div class="flex items-center space-x-3">
                    <button id="btn-novo-produto" onclick="openModal()" class="flex items-center space-x-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md transition-colors shadow-sm hidden">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                        <span class="hidden sm:inline">Novo Produto</span>
                    </button>
                    <button onclick="processLogout()" class="text-gray-500 hover:text-red-600 p-2 rounded-md transition-colors bg-gray-100 hover:bg-red-50" title="Sair do sistema">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex space-x-4 border-b border-gray-200">
                <button onclick="switchTab('estoque')" id="tab-estoque" class="nav-tab pb-3 px-2 flex items-center space-x-2 font-medium text-sm transition-colors relative text-green-600 border-b-2 border-green-600">
                    <i data-lucide="box" class="w-4 h-4"></i><span>Estoque</span>
                </button>
                <button onclick="switchTab('pdv')" id="tab-pdv" class="nav-tab pb-3 px-2 flex items-center space-x-2 font-medium text-sm transition-colors relative text-gray-500 hover:text-gray-700">
                    <i data-lucide="store" class="w-4 h-4"></i><span>PDV (Vendas)</span>
                </button>
                <button onclick="switchTab('caixa')" id="tab-caixa" class="nav-tab pb-3 px-2 flex items-center space-x-2 font-medium text-sm transition-colors relative text-gray-500 hover:text-gray-700">
                    <i data-lucide="history" class="w-4 h-4"></i><span>Controle de Caixa</span>
                </button>
            </div>
        </div>
    </header>

    <main id="app-main" class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full hidden">
        
        <!-- Alertas Globais -->
        <div id="alert-container" class="mb-6 hidden fade-in">
            <!-- Preenchido via JS -->
        </div>

        <!-- Conteúdo das Abas -->
        <div id="view-estoque" class="tab-content block fade-in">
            <!-- Dashboard e Tabela renderizados aqui -->
        </div>

        <div id="view-pdv" class="tab-content hidden fade-in">
            <!-- Interface PDV renderizada aqui -->
        </div>

        <div id="view-caixa" class="tab-content hidden fade-in">
            <!-- Interface Caixa renderizada aqui -->
        </div>

    </main>

    <!-- Modal Produto -->
    <div id="modal-produto" class="fixed inset-0 z-50 overflow-y-auto hidden">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onclick="closeModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <form id="form-produto" onsubmit="saveProduct(event)">
                    <input type="hidden" id="prod-id">
                    <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                        <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4 border-b pb-2" id="modal-title">Novo Produto</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Nome do Produto *</label>
                                <input type="text" id="prod-nome" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Categoria *</label>
                                <select id="prod-categoria" required class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
                                    <option value="" disabled selected>Selecione uma categoria</option>
                                    <option value="Hortifruti">Hortifruti</option>
                                    <option value="Bebidas">Bebidas</option>
                                    <option value="Laticínios">Laticínios</option>
                                    <option value="Limpeza">Limpeza</option>
                                    <option value="Mercearia">Mercearia</option>
                                    <option value="Padaria">Padaria</option>
                                    <option value="Outros">Outros</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Preço (R$) *</label>
                                    <input type="number" id="prod-preco" step="0.01" min="0" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Código/SKU</label>
                                    <div class="mt-1 flex rounded-md shadow-sm">
                                        <input type="text" id="prod-sku" placeholder="Opcional" class="flex-1 min-w-0 block w-full px-3 py-2 rounded-none rounded-l-md border border-gray-300 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
                                        <button type="button" onclick="startScanner('form')" class="inline-flex items-center px-3 rounded-r-md border border-l-0 border-gray-300 bg-gray-50 text-gray-600 hover:bg-gray-100 transition-colors">
                                            <i data-lucide="camera" class="w-5 h-5"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Qtd. em Estoque *</label>
                                    <input type="number" id="prod-qtd" min="0" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Estoque Mínimo *</label>
                                    <input type="number" id="prod-min-qtd" min="0" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse border-t border-gray-200">
                        <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-green-600 text-base font-medium text-white hover:bg-green-700 sm:ml-3 sm:w-auto sm:text-sm">Salvar Produto</button>
                        <button type="button" onclick="closeModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Scanner -->
    <div id="modal-scanner" class="fixed inset-0 z-[60] overflow-y-auto hidden">
        <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:p-0">
            <div class="fixed inset-0 bg-gray-900 bg-opacity-90 transition-opacity" onclick="stopScanner()"></div>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-medium text-gray-900">Ler Código de Barras</h3>
                        <button onclick="stopScanner()" class="text-gray-400 hover:text-gray-500"><i data-lucide="x" class="w-6 h-6"></i></button>
                    </div>
                    <div id="reader" class="w-full min-h-[300px]"></div>
                    <p class="text-sm text-gray-500 text-center mt-4">Posicione o código de barras no centro da câmera.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Checkout -->
    <div id="modal-checkout" class="fixed inset-0 z-50 overflow-y-auto hidden">
        <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:p-0">
            <div class="fixed inset-0 bg-gray-900 bg-opacity-75 transition-opacity" onclick="closeCheckoutModal()"></div>
            <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md w-full">
                <form id="form-checkout" onsubmit="processCheckout(event)">
                    <div class="bg-white px-6 pt-5 pb-6">
                        <div class="flex justify-between items-center mb-5 border-b pb-3">
                            <h3 class="text-xl font-bold text-gray-900 flex items-center">
                                <i data-lucide="receipt" class="mr-2 text-green-600"></i> Pagamento
                            </h3>
                            <button type="button" onclick="closeCheckoutModal()" class="text-gray-400 hover:text-gray-500"><i data-lucide="x" class="w-6 h-6"></i></button>
                        </div>
                        
                        <div class="mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200 text-center shadow-inner">
                            <p class="text-sm text-gray-500 uppercase tracking-wide font-semibold">Total a Pagar</p>
                            <p class="text-4xl font-extrabold text-green-600 mt-1" id="checkout-total">R$ 0,00</p>
                        </div>

                        <div class="space-y-5">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-3">Forma de Pagamento</label>
                                <div class="grid grid-cols-2 gap-3">
                                    <label class="pay-method border rounded-xl p-3 flex flex-col items-center cursor-pointer transition-all bg-green-50 border-green-500 text-green-700 shadow-sm ring-1 ring-green-500" onclick="setPaymentMethod('dinheiro', this)">
                                        <i data-lucide="banknote" class="w-6 h-6 mb-1"></i>
                                        <span class="text-sm font-medium">Dinheiro</span>
                                    </label>
                                    <label class="pay-method border rounded-xl p-3 flex flex-col items-center cursor-pointer transition-all bg-white border-gray-300 hover:bg-gray-50" onclick="setPaymentMethod('pix', this)">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><polygon points="12 2 22 12 12 22 2 12 12 2"></polygon></svg>
                                        <span class="text-sm font-medium">PIX</span>
                                    </label>
                                    <label class="pay-method border rounded-xl p-3 flex flex-col items-center cursor-pointer transition-all bg-white border-gray-300 hover:bg-gray-50" onclick="setPaymentMethod('cartao_debito', this)">
                                        <i data-lucide="credit-card" class="w-6 h-6 mb-1"></i>
                                        <span class="text-sm font-medium">Débito</span>
                                    </label>
                                    <label class="pay-method border rounded-xl p-3 flex flex-col items-center cursor-pointer transition-all bg-white border-gray-300 hover:bg-gray-50" onclick="setPaymentMethod('cartao_credito', this)">
                                        <i data-lucide="credit-card" class="w-6 h-6 mb-1"></i>
                                        <span class="text-sm font-medium">Crédito</span>
                                    </label>
                                </div>
                            </div>

                            <div id="dinheiro-panel" class="animate-in fade-in bg-green-50 p-4 rounded-xl border border-green-200">
                                <label class="block text-sm font-semibold text-green-900 mb-2">Valor Recebido (R$)</label>
                                <div class="relative rounded-md shadow-sm">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <span class="text-gray-500 sm:text-lg font-bold">R$</span>
                                    </div>
                                    <input type="number" id="checkout-recebido" step="0.01" oninput="calculateChange()" class="block w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 text-xl font-bold" placeholder="0.00">
                                </div>
                                <div id="troco-panel" class="mt-3 flex justify-between items-center bg-white p-3 rounded-lg border border-green-200 hidden">
                                    <span class="text-sm font-bold text-gray-700">Troco a devolver:</span>
                                    <span class="text-xl font-extrabold text-green-600" id="checkout-troco">R$ 0,00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-6 py-4 rounded-b-xl flex flex-col sm:flex-row-reverse gap-3 border-t border-gray-200">
                        <button type="submit" id="btn-confirm-checkout" class="w-full inline-flex justify-center rounded-lg border border-transparent shadow-md px-4 py-3 bg-green-600 text-base font-bold text-white hover:bg-green-700 disabled:opacity-50 sm:w-auto sm:text-sm">Confirmar Venda</button>
                        <button type="button" onclick="closeCheckoutModal()" class="w-full inline-flex justify-center rounded-lg border border-gray-300 shadow-sm px-4 py-3 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:w-auto sm:text-sm">Voltar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts Firebase e Lógica da Aplicação -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        // NOVO: Importando funções de Login com E-mail e Senha
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // COLOQUE AS CREDENCIAIS DO SEU FIREBASE AQUI
        // ==========================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };
        const appId = 'quitanda-manager';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // App State Globals
        window.user = null;
        window.products = [];
        window.sales = [];
        window.cart = [];
        window.currentTab = 'estoque';
        window.searchTerm = '';
        window.posSearchTerm = '';
        window.paymentMethod = 'dinheiro';
        window.cartTotal = 0;
        window.html5QrcodeScanner = null;
        window.scannerTarget = null; // 'pos' ou 'form'

        // Utils
        const formatMoney = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        const formatDateTime = (isoString) => new Date(isoString).toLocaleString('pt-BR');
        const generateSKU = () => Math.random().toString(36).substring(2, 8).toUpperCase();

        // Referências para desligar os listeners
        let unsubProducts = null;
        let unsubSales = null;

        // ==========================
        // AUTHENTICATION LOGIC
        // ==========================
        window.processLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-address').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            
            btn.disabled = true;
            btn.innerText = 'Entrando...';
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                document.getElementById('email-address').value = '';
                document.getElementById('password').value = '';
            } catch (error) {
                console.error(error);
                let msg = "Erro ao fazer login. Verifique suas credenciais.";
                if(error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    msg = "E-mail ou senha incorretos.";
                }
                alert(msg); // Usamos um alert comum aqui, pois o layout principal pode estar oculto
            } finally {
                btn.disabled = false;
                btn.innerText = 'Entrar no Sistema';
            }
        };

        window.processLogout = async () => {
            try {
                await signOut(auth);
            } catch(e) {
                console.error(e);
            }
        };

        // Listeners do Banco e Auth (Monitora se está logado ou não)
        onAuthStateChanged(auth, (currentUser) => {
            window.user = currentUser;
            
            const loginContainer = document.getElementById('login-container');
            const appHeader = document.getElementById('app-header');
            const appMain = document.getElementById('app-main');

            if (currentUser) {
                // Usuário Logado: Esconde o login, mostra o sistema
                loginContainer.classList.add('hidden');
                appHeader.classList.remove('hidden');
                appMain.classList.remove('hidden');

                const productsRef = collection(db, 'artifacts', appId, 'public', 'data', 'products');
                const salesRef = collection(db, 'artifacts', appId, 'public', 'data', 'sales');

                unsubProducts = onSnapshot(productsRef, (snapshot) => {
                    window.products = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    window.products.sort((a, b) => a.name.localeCompare(b.name));
                    reRenderCurrentTab();
                }, (err) => console.error(err));

                unsubSales = onSnapshot(salesRef, (snapshot) => {
                    window.sales = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    window.sales.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    if(window.currentTab === 'caixa') renderCaixa();
                }, (err) => console.error(err));
            } else {
                // Usuário Deslogado: Mostra o login, esconde o sistema
                loginContainer.classList.remove('hidden');
                appHeader.classList.add('hidden');
                appMain.classList.add('hidden');

                // Para de escutar o banco se estava escutando
                if(unsubProducts) unsubProducts();
                if(unsubSales) unsubSales();

                // Limpa os dados em memória por segurança
                window.products = [];
                window.sales = [];
                window.cart = [];
            }
        });

        // Inicializa icones pela primeira vez
        lucide.createIcons();

        // ==========================
        // UI & NAVIGATION FUNCTIONS
        // ==========================
        window.switchTab = (tabId) => {
            window.currentTab = tabId;
            
            // Estilizar tabs
            document.querySelectorAll('.nav-tab').forEach(t => {
                t.classList.remove('text-green-600', 'border-b-2', 'border-green-600');
                t.classList.add('text-gray-500', 'hover:text-gray-700');
            });
            const activeTab = document.getElementById(`tab-${tabId}`);
            activeTab.classList.remove('text-gray-500', 'hover:text-gray-700');
            activeTab.classList.add('text-green-600', 'border-b-2', 'border-green-600');

            // Mostrar conteudo correspondente
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(`view-${tabId}`).classList.remove('hidden');

            // Botão "Novo Produto" apenas no estoque
            const btnNovo = document.getElementById('btn-novo-produto');
            tabId === 'estoque' ? btnNovo.classList.remove('hidden') : btnNovo.classList.add('hidden');

            reRenderCurrentTab();
        };

        const reRenderCurrentTab = () => {
            if(window.currentTab === 'estoque') renderEstoque();
            if(window.currentTab === 'pdv') renderPDV();
            if(window.currentTab === 'caixa') renderCaixa();
            lucide.createIcons();
        };

        window.showAlert = (msg, type = "error") => {
            const container = document.getElementById('alert-container');
            const isSuccess = type === 'success';
            
            container.innerHTML = `

                cartContainer.innerHTML = window.cart.map(item => `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-100 mb-2">

                            <button onclick="removeFromCart('${item.product.id}')" class="p-1 ml-1 text-red-500 hover:text-red-700"><i data-lucide="trash-2" class="w-4 h-4"></i></button>

                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="search" class="h-5 w-5 text-gray-400"></i></div>

            // Focar input após renderizar

        const renderCaixa = () => {
            const view = document.getElementById('view-caixa');
            
            const total = window.sales.reduce((sum, s) => sum + s.total, 0);
            const totalDinheiro = window.sales.filter(s => s.paymentMethod === 'dinheiro').reduce((sum, s) => sum + s.total, 0);
            const totalPix = window.sales.filter(s => s.paymentMethod === 'pix').reduce((sum, s) => sum + s.total, 0);
            const totalCartao = window.sales.filter(s => s.paymentMethod.includes('cartao')).reduce((sum, s) => sum + s.total, 0);

            const tableRows = window.sales.length === 0 ? 
                `<tr><td colspan="4" class="px-6 py-12 text-center text-gray-500">Nenhuma venda registrada ainda.</td></tr>` :
                window.sales.map(s => {
                    let badgeClass = s.paymentMethod === 'dinheiro' ? 'bg-green-50 text-green-700 border-green-200' :

                            ${s.items.map(i => `${i.qty}x ${i.name}`).join(', ')}

                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full border ${badgeClass}">

                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900 text-right">${formatMoney(s.total)}</td>
                    </tr>
                `}).join('');

            view.innerHTML = `
                <div class="space-y-6">
                    <h2 class="text-xl font-bold text-gray-900 flex items-center mb-6"><i data-lucide="history" class="mr-2 w-6 h-6"></i> Histórico de Vendas e Caixa</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <p class="text-sm text-gray-500 font-medium">Faturamento Total</p>
                            <p class="text-2xl font-bold text-gray-900 mt-1">${formatMoney(total)}</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">

                            <p class="text-xl font-bold text-green-600 mt-1">${formatMoney(totalDinheiro)}</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <p class="text-sm text-gray-500 font-medium flex items-center"><i data-lucide="credit-card" class="w-4 h-4 mr-1"></i> Cartões</p>
                            <p class="text-xl font-bold text-blue-600 mt-1">${formatMoney(totalCartao)}</p>
                        </div>

                            <p class="text-sm text-gray-500 font-medium flex items-center">PIX</p>

                        </div>
                    </div>

                    <div class="bg-white shadow-sm rounded-xl border border-gray-200 overflow-hidden">
                        <div class="overflow-x-auto max-h-[600px]">

                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Itens Vendidos</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pagamento</th>
                                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>

        // ==========================
        // CRUD & FORM LOGIC
        // ==========================
        window.openModal = () => {
            document.getElementById('modal-title').innerText = 'Novo Produto';

            document.getElementById('prod-id').value = '';
            document.getElementById('modal-produto').classList.remove('hidden');
        };

        window.openEditModal = (p) => {
            document.getElementById('modal-title').innerText = 'Editar Produto';
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-nome').value = p.name;
            document.getElementById('prod-categoria').value = p.category;
            document.getElementById('prod-preco').value = p.price;
            document.getElementById('prod-sku').value = p.sku;
            document.getElementById('prod-qtd').value = p.quantity;
            document.getElementById('prod-min-qtd').value = p.minQuantity;
            document.getElementById('modal-produto').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('modal-produto').classList.add('hidden');
        };

        window.saveProduct = async (e) => {
            e.preventDefault();
            if(!window.user) return;
            
            const id = document.getElementById('prod-id').value;
            const data = {
                name: document.getElementById('prod-nome').value,
                category: document.getElementById('prod-categoria').value,
                price: parseFloat(document.getElementById('prod-preco').value) || 0,
                sku: document.getElementById('prod-sku').value || generateSKU(),
                quantity: parseInt(document.getElementById('prod-qtd').value) || 0,
                minQuantity: parseInt(document.getElementById('prod-min-qtd').value) || 5,
                updatedAt: new Date().toISOString()
            };

            try {
                if (id) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', id), data);
                } else {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), data);
                }
                closeModal();
            } catch (error) {
                console.error("Erro:", error);
                showAlert("Erro ao salvar produto.");
            }
        };

        window.deleteProduct = async (id) => {
            if(!window.user) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', id));
            } catch (error) {
                console.error("Erro:", error);
                showAlert("Erro ao excluir produto.");
            }
        };

        // ==========================
        // CART LOGIC
        // ==========================
        window.addToCart = (productId) => {
            const product = window.products.find(p => p.id === productId);
            if (!product) return;

            const existing = window.cart.find(i => i.product.id === productId);
            if (existing) {
                if (existing.qty >= product.quantity) {
                    showAlert(`Estoque insuficiente para ${product.name}. Apenas ${product.quantity} disponíveis.`);
                    return;
                }
                existing.qty++;
            } else {
                if (product.quantity <= 0) {
                    showAlert(`${product.name} está esgotado.`);
                    return;
                }
                window.cart.push({ product, qty: 1 });
            }
            renderCart();
            
            // Foco de volta ao input para leitura contínua
            const input = document.getElementById('pdv-search-input');
            if(input) { input.value=''; window.posSearchTerm=''; input.focus(); renderPDVProductsGrid(); }
        };

        window.updateCartQty = (productId, delta) => {
            const item = window.cart.find(i => i.product.id === productId);
            if(!item) return;

            const newQty = item.qty + delta;
            if (newQty > item.product.quantity) {
                showAlert(`Apenas ${item.product.quantity} disponíveis em estoque.`);
                return;
            }
            if (newQty <= 0) {
                window.removeFromCart(productId);
            } else {
                item.qty = newQty;
                renderCart();
            }
        };

            window.cart = window.cart.filter(i => i.product.id !== productId);
            renderCart();
        };

            });
            document.querySelector('.pay-method').classList.add('bg-green-50', 'border-green-500', 'ring-1', 'ring-green-500');
            document.getElementById('dinheiro-panel').classList.remove('hidden');

            document.getElementById('modal-checkout').classList.remove('hidden');
        };

            document.getElementById('modal-checkout').classList.add('hidden');

            window.paymentMethod = method;
            
            document.querySelectorAll('.pay-method').forEach(e => {
                e.classList.remove('bg-green-50', 'bg-purple-50', 'bg-blue-50', 'text-green-700', 'text-purple-700', 'text-blue-700', 'border-green-500', 'border-purple-500', 'border-blue-500', 'ring-1', 'ring-green-500', 'ring-purple-500', 'ring-blue-500');
                e.classList.add('bg-white', 'border-gray-300');
            });

            if(method === 'dinheiro') el.classList.add('bg-green-50', 'text-green-700', 'border-green-500', 'ring-1', 'ring-green-500');
            else if(method === 'pix') el.classList.add('bg-purple-50', 'text-purple-700', 'border-purple-500', 'ring-1', 'ring-purple-500');
            else el.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-500', 'ring-1', 'ring-blue-500');

            if(method === 'dinheiro') {
                document.getElementById('dinheiro-panel').classList.remove('hidden');
                calculateChange();
            } else {
                document.getElementById('dinheiro-panel').classList.add('hidden');
                document.getElementById('btn-confirm-checkout').disabled = false;
            }
        };

        window.calculateChange = () => {
            if(window.paymentMethod !== 'dinheiro') return;
            
            const recebidoStr = document.getElementById('checkout-recebido').value;
            const recebido = parseFloat(recebidoStr) || 0;
            const trocoPanel = document.getElementById('troco-panel');
            const btn = document.getElementById('btn-confirm-checkout');

            if (recebidoStr && recebido >= window.cartTotal) {
                const troco = recebido - window.cartTotal;
                document.getElementById('checkout-troco').innerText = formatMoney(troco);
                trocoPanel.classList.remove('hidden');
                btn.disabled = false;
            } else {
                trocoPanel.classList.add('hidden');
                btn.disabled = true;
            }
        };

        window.processCheckout = async (e) => {
            e.preventDefault();
            if(!window.user || window.cart.length === 0) return;

            const btn = document.getElementById('btn-confirm-checkout');
            btn.disabled = true;
            btn.innerText = 'Processando...';

            const recebido = parseFloat(document.getElementById('checkout-recebido').value) || window.cartTotal;
            const troco = window.paymentMethod === 'dinheiro' ? recebido - window.cartTotal : 0;

            try {
                // 1. Atualizar estoque
                for (const item of window.cart) {
                    const ref = doc(db, 'artifacts', appId, 'public', 'data', 'products', item.product.id);
                    const newQty = item.product.quantity - item.qty;
                    await updateDoc(ref, { quantity: newQty });
                }

                // 2. Registrar Venda
                const saleData = {
                    items: window.cart.map(i => ({ id: i.product.id, name: i.product.name, qty: i.qty, price: i.product.price })),
                    total: window.cartTotal,
                    paymentMethod: window.paymentMethod,
                    amountPaid: window.paymentMethod === 'dinheiro' ? recebido : window.cartTotal,
                    change: troco,
                    timestamp: new Date().toISOString()
                };
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'sales'), saleData);

                // 3. Limpar e notificar
                window.cart = [];
                closeCheckoutModal();
                renderCart();
                
                let successMsg = "Venda finalizada com sucesso!";
                if(troco > 0) successMsg += `<br/><b>Troco a devolver: ${formatMoney(troco)}</b>`;
                showAlert(successMsg, 'success');

            } catch (err) {
                console.error(err);
                showAlert("Erro ao processar venda.");
            } finally {
                btn.innerText = 'Confirmar Venda';
                btn.disabled = false;
            }
        };

        // ==========================
        // SCANNER LOGIC
        // ==========================
        window.startScanner = (target) => {
            window.scannerTarget = target;
            document.getElementById('modal-scanner').classList.remove('hidden');
            
            if(!window.html5QrcodeScanner) {
                window.html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} });
            }
            
            window.html5QrcodeScanner.render((decodedText) => {
                if(window.scannerTarget === 'pos') {
                    const matched = window.products.find(p => p.sku === decodedText);
                    if(matched) {
                        addToCart(matched.id);
                    } else {
                        showAlert(`Código ${decodedText} não encontrado no estoque.`);
                    }
                } else if (window.scannerTarget === 'form') {
                    document.getElementById('prod-sku').value = decodedText;
                }
                stopScanner();
            }, (error) => {
                // Ignore erros contínuos de leitura
            });
        };

        window.stopScanner = () => {
            if(window.html5QrcodeScanner) {
                window.html5QrcodeScanner.clear().catch(e => console.error(e));
            }
            document.getElementById('modal-scanner').classList.add('hidden');
        };

        // Inicia na aba de estoque
        switchTab('estoque');

    </script>
</body>
</html>
